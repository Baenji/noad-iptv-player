name: Scaffold platforms
# Einmalig: erzeugt die Plattform-Ordner (windows/, macos/) mit flutter create
# und committet sie ins Repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: flutter create
        run: |
          mkdir /tmp/gen && cd /tmp/gen
          flutter create --platforms=windows,macos --org de.noad --project-name noad_iptv app
          cp -r app/windows app/macos app/.metadata "$GITHUB_WORKSPACE/"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows macos .metadata
          git commit -m "Plattform-Ordner für Windows und macOS erzeugt (flutter create)"
          git push
